name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        env:
          # The site is served from the root of the custom domain
          # (appvault.lexostudio.gm), so assets live at /assets/*.
          # Without a custom domain, Pages serves at /<repo>/ instead — set a
          # BASE_PATH repository variable to "/appvault/" in that case.
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          # Optional: set as a repository variable (Settings > Secrets and
          # variables > Actions > Variables). Empty means local-only mode.
          VITE_SHEETS_WEB_APP_URL: ${{ vars.VITE_SHEETS_WEB_APP_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
